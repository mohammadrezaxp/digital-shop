{% load static %}
<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>{% block title %}دیجیتال شاپ{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="{% static 'css/custom.css' %}" rel="stylesheet"/>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #f7f8f8; color: #0b132b; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="antialiased min-h-screen flex flex-col">
    <!-- Site Header -->
    <header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-lg border-b border-gray-200 shadow-sm">
        <div class="flex justify-between items-center px-4 sm:px-8 lg:px-16 h-20 max-w-[1400px] mx-auto">
            <div class="flex items-center gap-2">
                <a href="{% url 'shop:home' %}" class="flex items-center gap-2">
                    <svg class="text-brand-dark" fill="none" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM13 17H11V15H13V17ZM13 13H11V7H13V13Z" fill="currentColor"></path>
                    </svg>
                    <span class="text-xl font-bold tracking-tight">دیجیتال شاپ</span>
                </a>
            </div>
            <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-gray-600">
                <a class="hover:text-black transition-colors" href="{% url 'shop:home' %}">خانه</a>
                <a class="hover:text-black transition-colors" href="{% url 'shop:catalog' %}">محصولات</a>
                <a class="hover:text-black transition-colors" href="{% url 'shop:about' %}">درباره ما</a>
            </nav>
            <div class="flex items-center gap-4">
                <a class="text-sm font-medium text-gray-600 hover:text-black transition-colors hidden sm:block" href="{% url 'shop:login' %}">ورود</a>
                <a class="bg-black text-white text-sm font-medium py-2 px-5 rounded-full hover:bg-gray-800 transition-colors shadow-sm" href="{% url 'shop:signup' %}">ثبت‌نام</a>
                <a href="{% url 'shop:profile' %}" class="p-2 rounded-full hover:bg-gray-100 transition-all">
                    <span class="material-symbols-outlined">account_circle</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow pt-20">
        {% block content %}{% endblock %}
    </main>

    <!-- Site Footer -->
    <footer class="w-full py-8 mt-auto bg-white border-t border-gray-200">
        <div class="flex flex-col md:flex-row justify-between items-center px-4 sm:px-8 lg:px-16 gap-4 max-w-[1400px] mx-auto text-sm text-gray-500">
            <div>© ۲۰۲۴ دیجیتال شاپ. تمامی حقوق محفوظ است.</div>
            <div class="flex gap-6">
                <a href="{% url 'shop:about' %}" class="hover:text-black">درباره ما</a>
                <a href="#" class="hover:text-black">قوانین</a>
                <a href="#" class="hover:text-black">تماس با ما</a>
            </div>
        </div>
    </footer>
</body>
</html>
