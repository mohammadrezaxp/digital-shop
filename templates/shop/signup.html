{% extends "base.html" %}
{% load static %}

{% block title %}ساخت حساب کاربری - Digital Shop{% endblock %}

{% block content %}
<!-- Ambient Background Elements -->
<div class="ambient-bg pointer-events-none">
<div class="ambient-orb orb-1" style="transform: translate(15.6562px, 16.5625px);"></div>
<div class="ambient-orb orb-2" style="transform: translate(31.3125px, 33.125px);"></div>
<div class="ambient-orb orb-3" style="transform: translate(46.9688px, 49.6875px);"></div>
<!-- Abstract Particles/Crystals using CSS for lightweight rendering -->
<div class="absolute top-[20%] right-[15%] w-16 h-16 border border-white/10 rounded-lg rotate-45 backdrop-blur-md bg-surface/20 floating-element"></div>
<div class="absolute bottom-[30%] left-[10%] w-24 h-24 border border-secondary/20 rounded-full backdrop-blur-sm bg-secondary/5 floating-element-delayed"></div>
<div class="absolute top-[40%] left-[20%] w-8 h-8 bg-primary/30 rounded-sm rotate-12 blur-sm floating-element" style="animation-duration: 4s;"></div>
</div>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center py-stack-gap px-margin-mobile md:px-margin-desktop relative z-10 min-h-screen">
<div class="w-full max-w-md">
<!-- Logo / Brand Area -->
<div class="text-center mb-stack-gap floating-element" style="animation-duration: 8s;">
<h1 class="font-display-lg text-display-lg tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary">
                    Digital Shop
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-unit">آینده را تجربه کنید</p>
</div>
<!-- Sign Up Form Card -->
<div class="glass-card rounded-[2rem] p-stack-gap">
<div class="mb-gutter text-center">
<h2 class="font-headline-md text-headline-md text-on-surface">ساخت حساب کاربری</h2>
<p class="font-body-md text-body-md text-on-surface-variant text-sm mt-2">به دنیای دیجیتال شاپ بپیوندید</p>
</div>
<form class="space-y-gutter" onsubmit="handleSignup(event)">
<!-- Full Name -->
<div>
<label class="block font-body-md text-body-md text-sm text-on-surface mb-2" for="fullname">نام و نام خانوادگی</label>
<div class="relative">
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full custom-input rounded-full py-3 pr-12 pl-4 font-body-md text-body-md transition-all focus:ring-0" id="fullname" placeholder="مثال: علی رضایی" type="text">
</div>
</div>
<!-- Email -->
<div>
<label class="block font-body-md text-body-md text-sm text-on-surface mb-2" for="email">ایمیل</label>
<div class="relative">
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full custom-input rounded-full py-3 pr-12 pl-4 font-body-md text-body-md text-left transition-all focus:ring-0" dir="ltr" id="email" placeholder="example@mail.com" type="email">
</div>
</div>
<!-- Password -->
<div>
<label class="block font-body-md text-body-md text-sm text-on-surface mb-2" for="password">رمز عبور</label>
<div class="relative">
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full custom-input rounded-full py-3 pr-12 pl-4 font-body-md text-body-md text-left transition-all focus:ring-0" dir="ltr" id="password" placeholder="••••••••" type="password">
<button class="absolute left-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Confirm Password -->
<div>
<label class="block font-body-md text-body-md text-sm text-on-surface mb-2" for="confirm_password">تکرار رمز عبور</label>
<div class="relative">
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline">lock_reset</span>
<input class="w-full custom-input rounded-full py-3 pr-12 pl-4 font-body-md text-body-md text-left transition-all focus:ring-0" dir="ltr" id="confirm_password" placeholder="••••••••" type="password">
</div>
</div>
<!-- Submit Button -->
<button class="w-full gradient-btn rounded-full py-4 font-headline-md text-body-md font-bold text-surface-container-lowest mt-stack-gap flex items-center justify-center gap-2" type="submit">
<span class="">ساخت حساب</span>
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center my-stack-gap">
<div class="flex-grow h-px bg-white/10"></div>
<span class="px-4 font-label-mono text-label-mono text-outline-variant uppercase">یا</span>
<div class="flex-grow h-px bg-white/10"></div>
</div>
<!-- Social Login -->
<div class="space-y-4">
<button class="w-full bg-surface-container-low hover:bg-surface-container-high border border-white/10 rounded-full py-3 flex items-center justify-center gap-3 transition-colors duration-300">
<!-- Simulated Google Icon using simple CSS shapes for dark mode compatibility without external images -->
<img src="https://lh3.googleusercontent.com/aida/AP1WRLtljcEbdoLFi-pb2GTk8azkiYsjL-hQighi_xuPSPi84d08ysuPP7tt7CjlrZAhPTEGM82aUjvJ6yhOw79SRQ-3G3JBmQgVVzLwf5-RczcvelLO2JsuB7LXLGmiH2vyO88TTgkgiLM1x2_IyWtTIR45gcnemNy7FMo95ChH_-HtA88GMjbyB3_f6CsUD1BLbn3vmikVXtSAgfeJ66fKawXz95kLpoG6znU01lrjlVx6kqoRJ2YtigBJda0" alt="Google" class="w-5 h-5 rounded-full object-contain">
<span class="font-body-md text-body-md text-on-surface text-sm">ثبت نام با گوگل</span>
</button>
</div>
<!-- Login Link -->
<div class="mt-stack-gap text-center">
<p class="font-body-md text-body-md text-sm text-on-surface-variant">
                        قبلاً حساب دارید؟
                        <a class="text-secondary hover:text-primary transition-colors font-medium" href="{% url 'shop:login' %}">وارد شوید</a>
</p>
</div>
</div>
</div>
</main>
{% endblock %}
