{% extends "base.html" %}
{% load static %}

{% block title %}خانه - دیجیتال شاپ{% endblock %}

{% block extra_head %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Vazirmatn', 'sans-serif'],
          },
          colors: {
            'brand-blue': '#0052FF',
            'brand-dark': '#0B132B',
            'brand-gray': '#4B5563',
            'brand-light-blue': '#E5EDFF',
          },
          backgroundImage: {
            'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
            'sky-gradient': 'linear-gradient(180deg, #E0F2FE 0%, #FFFFFF 100%)',
          }
        }
      }
    }

</script>
{% endblock %}

{% block content %}
<canvas class="fixed inset-0 w-full h-full z-[-2] pointer-events-none" id="bg-canvas" width="1280" height="954"></canvas>
<!-- Top Badge -->
<div class="inline-flex items-center gap-2 bg-gray-50 border border-gray-100 rounded-full py-1.5 px-4 mb-8">
<span class="text-xs font-medium text-gray-500">برای توسعه‌دهندگان، تیم‌ها و آژانس‌ها</span>
<svg class="text-gray-400 rotate-180" fill="none" height="12" viewBox="0 0 24 24" width="12" xmlns="http://www.w3.org/2000/svg">
<path d="M9 18L15 12L9 6" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<!-- Main Heading -->
<h1 class="text-4xl sm:text-5xl md:text-6xl font-black leading-tight tracking-tight mb-6 max-w-4xl mx-auto text-center break-words" style="font-family: serif;">
        دنیای ابزارهای دیجیتال
</h1>
<!-- Subheading -->

<!-- Call to Action Buttons -->
<div class="flex flex-col sm:flex-row items-center gap-4 mb-24">
<a class="bg-brand-blue hover:bg-blue-600 text-white font-medium py-3 px-8 rounded-full shadow-[0_4px_14px_0_rgba(0,82,255,0.39)] hover:shadow-[0_6px_20px_rgba(0,82,255,0.23)] transition-all flex items-center gap-2" href="#">
          شروع کنید
          <svg class="rotate-180" fill="none" height="16" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
<path d="M9 18L15 12L9 6" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</a>
<a class="bg-white hover:bg-gray-50 text-brand-dark border border-gray-200 font-medium py-3 px-8 rounded-full shadow-sm transition-all flex items-center gap-2" href="#">
          برای چه کسانی است؟
          <svg class="rotate-180" fill="none" height="16" viewBox="0 0 24 24" width="16" xmlns="http://www.w3.org/2000/svg">
<path d="M9 18L15 12L9 6" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</a>
</div>
<!-- BEGIN: Dashboard Preview Wrapper -->
<div class="w-full max-w-5xl mx-auto relative mt-auto" data-purpose="dashboard-preview-container">
<!-- Abstract Blue Cloud/Glow Background -->
<div class="absolute -bottom-20 left-1/2 -translate-x-1/2 w-[120%] h-[300px] bg-blue-400 opacity-20 blur-[80px] rounded-full z-0 pointer-events-none"></div>
<div class="absolute -bottom-10 left-1/4 w-1/2 h-[200px] bg-brand-blue opacity-30 blur-[100px] rounded-full z-0 pointer-events-none"></div>
<!-- Tooltip/Floating Label -->

<!-- Fake Dashboard UI -->
<div class="dashboard-preview rounded-t-[2rem] border border-white/50 border-b-0 w-full h-[150px] overflow-hidden flex flex-col relative z-10">
<!-- Dashboard Header -->

<!-- Dashboard Content Area (Empty for effect) -->
<div class="flex-grow bg-white/20"></div>
</div>
</div>
<!-- END: Dashboard Preview Wrapper -->

{% endblock %}
